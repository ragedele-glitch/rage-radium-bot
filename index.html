<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e1116">
<title>Rage Radium Bot</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--line:#252b35;--tx:#e6e9ef;--mut:#8a93a3;--g:#22c55e;--r:#ef4444;--y:#eab308;--b:#3b82f6}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.title{font-weight:700;font-size:16px}.paper{font-size:11px;font-weight:700;color:#111;background:var(--y);border-radius:4px;padding:2px 6px;margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%}.on{background:var(--g);box-shadow:0 0 8px var(--g)}.off{background:var(--r)}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:0;color:var(--mut);font:inherit;font-weight:600;padding:8px 10px;border-bottom:2px solid transparent}
nav button.act{color:var(--tx);border-color:var(--b)}
main{padding:12px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:30px;font-weight:700}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.m{color:var(--mut)}.s{font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv{background:#11151b;border-radius:8px;padding:8px}.kv b{display:block;font-size:17px}.kv span{font-size:12px;color:var(--mut)}
.row{border-top:1px solid var(--line);padding:10px 0}.row:first-child{border-top:0;padding-top:0}
.rh{display:flex;justify-content:space-between;gap:8px;font-weight:600}.rd{font-size:13px;color:var(--mut);margin-top:3px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 7px;border-radius:5px;margin-top:4px}
.t-copied{background:#123d24;color:#4ade80}.t-killed{background:#3d1414;color:#f87171}.t-passed{background:#13284a;color:#93c5fd}.t-skip,.t-ignored{background:#262b33;color:#aab2bf}
.bar{display:flex;gap:2px;height:22px;margin:6px 0}.bar i{flex:1;border-radius:2px}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.filt button{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px}.filt button.act{background:var(--b);border-color:var(--b)}
.warn{background:#3a1d0d;border:1px solid #7c2d12;color:#fed7aa;border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
.empty{color:var(--mut);text-align:center;padding:18px 0}
svg{display:block;width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}td:first-child,th:first-child{text-align:left}th{color:var(--mut);font-weight:600}
footer{color:var(--mut);font-size:12px;text-align:center;padding:4px 12px 24px}
.lv .dot{display:inline-block;width:7px;height:7px;margin-right:5px;background:var(--g);vertical-align:middle}.fu{animation:fu 1.2s}.fd{animation:fd 1.2s}@keyframes fu{from{background:rgba(34,197,94,.35)}to{background:transparent}}@keyframes fd{from{background:rgba(239,68,68,.35)}to{background:transparent}}
.rbadge{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:6px;letter-spacing:.05em}.rb-dry{background:#13284a;color:#93c5fd}.rb-live{background:#7f1d1d;color:#fff}.rb-off{background:#262b33;color:#aab2bf}.rbig{display:block;text-align:center;font-weight:700;font-size:16px;padding:12px;border-radius:10px;margin-top:8px;text-decoration:none}.rb-stop{background:#b91c1c;color:#fff}.rb-pause{background:#a16207;color:#fff}.rb-go{background:#15803d;color:#fff}
.mid{background:var(--y)}
</style>
</head><body>
<header>
 <div class="top"><div class="title">Rage Radium Bot<span id="badge"></span></div><div id="pill" class="pill"><span class="dot mid"></span>Loading…</div></div>
 <nav id="nav"></nav>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<footer id="foot">Updates by itself every minute. Your wallet address is never shown on this page.</footer>
<script>
// Rage Radium Bot's own page, laid out like the Rage Meme Bot page. It reads radium.enc (sealed with the key after the #
// in this link; the key never leaves your phone) from the radium-data branch, which the bot updates about once a minute.
const TABS=[["ov","Overview"],["pos","Positions"],["hist","History"],["sig","Signals"],["stats","Stats"],["log","Activity"],["wal","Wallets"],["ctl","Controls"]];
const OWNER="ragedele-glitch",REPO="paper-scanner";
const CTL=`https://github.com/${OWNER}/${REPO}/actions/workflows/radium-control.yml`,WF=`https://github.com/${OWNER}/${REPO}/actions/workflows/radium.yml`;
let K=location.hash.slice(1);if(K.length>20){try{localStorage.setItem("rk",K)}catch(e){}}else{try{K=localStorage.getItem("rk")||""}catch(e){}}
let tab=(()=>{try{return localStorage.getItem("rtab")||"ov"}catch(e){return"ov"}})(),R=null,sigF="all",errMsg="",V=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd=(v,d=2)=>v==null?"–":(v<0?"-$":"$")+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(v,d=2)=>v==null?"–":(v>=0?"+":"-")+"$"+Math.abs(v).toFixed(d);
const pct=(v,d=1)=>v==null||!isFinite(v)?"–":(v>=0?"+":"")+v.toFixed(d)+"%";
const cls=v=>v==null?"m":v>0?"g":v<0?"r":"m";
function px(v){if(v==null)return"–";if(v>=1)return"$"+v.toFixed(4);const s=v.toPrecision(3);if(v>=1e-4)return"$"+Number(s);const m=v.toExponential(2).split("e");return"$"+m[0]+"e"+m[1]}
const T=ts=>ts?new Date(ts*1000).toLocaleString("en-GB",{timeZone:"Africa/Lagos",weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:true}):"–";
const TT=ts=>ts?new Date(ts*1000).toLocaleTimeString("en-GB",{timeZone:"Africa/Lagos",hour:"2-digit",minute:"2-digit",hour12:true}):"–";
const D=ts=>ts?new Date(ts*1000).toLocaleDateString("en-GB",{timeZone:"Africa/Lagos",weekday:"short",day:"numeric",month:"short"}):"–";
function ago(s){s=Math.max(0,s);if(s<60)return Math.round(s)+"s ago";if(s<3600)return Math.round(s/60)+" min ago";if(s<86400)return(s/3600).toFixed(1)+" h ago";return(s/86400).toFixed(1)+" days ago"}
function dur(s){if(s<3600)return Math.max(1,Math.round(s/60))+" min";if(s<86400)return(s/3600).toFixed(1)+" h";return(s/86400).toFixed(1)+" d"}
const secs=v=>v==null?"–":v<10?v.toFixed(1)+" s":v<120?Math.round(v)+" s":dur(v);
const live=()=>R&&R.mode=="live";
const would=(a,b)=>live()?a:b;
function badge(){const m=R?R.mode:"";return m=="live"?'<span class="paper" style="background:var(--g);color:#fff">LIVE</span>':'<span class="paper" style="background:#93c5fd">DRY-RUN</span>'}
function nav(){$("#nav").innerHTML=TABS.map(([k,n])=>`<button class="${k==tab?"act":""}" onclick="go('${k}')">${n}${k=="pos"&&R?` (${(R.open||[]).length})`:""}</button>`).join("")}
function go(k){tab=k;try{localStorage.setItem("rtab",k)}catch(e){};render();scrollTo(0,0)}
function state(){const now=Date.now()/1000,age=now-R.ts,E=R.engine||{};const ok=age<180,eng=E.up&&R.state=="engine";
 return{now,age,ok,eng,txt:!ok?"Not reporting":eng?"Running":R.role=="bridge"?"Between runs":"Engine restarting",dot:ok?(eng?"on":"mid"):"off"}}
// ---- money: no assumed deposit anywhere. The wallet line is blank until the Radium wallet really holds SOL;
// the dry run's results are shown as profit and loss only.
function lpx(t){const q=LQ[t.mint];return q&&Date.now()/1000-q.t<45?q.p:null}
function tval(t){const P=lpx(t);if(P&&t.qty!=null)return t.qty*P;return t.value||0}
function tpnl(t){return tval(t)+(t.half_usd||0)-(t.stake||0)}
const funded=()=>R&&R.balance_sol!=null&&R.balance_sol>=0.01;   // a few cents of leftover dust is not a deposit
function money(){const x=R.stats||{},o=R.open||[];const ov=o.reduce((s,t)=>s+tval(t),0),opnl=o.reduce((s,t)=>s+tpnl(t),0);
 const w=funded()?R.balance_usd:null;return{w,ov,eq:w==null?null:w+(live()?ov:0),real:x.pnl||0,opnl,tot:(x.pnl||0)+opnl}}
function curve(pts,base){if(pts.length<2)return'<div class="empty">The chart appears after the first closed trade.</div>';
 const W=600,H=170,P=6,xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys,base),y1=Math.max(...ys,base);if(y1-y0<2){y0-=1;y1+=1}
 const X=x=>P+(x-x0)/(x1-x0||1)*(W-2*P),Y=y=>H-P-(y-y0)/(y1-y0)*(H-2*P);
 const d=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join("");const last=ys[ys.length-1],col=last>=base?"#22c55e":"#ef4444";
 return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:170px"><line x1="0" x2="${W}" y1="${Y(base)}" y2="${Y(base)}" stroke="#3a4250" stroke-dasharray="4 4"/><path d="${d} L${X(x1)},${H} L${X(x0)},${H}Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" vector-effect="non-scaling-stroke"/></svg><div class="rd" style="display:flex;justify-content:space-between"><span>${T(x0)}</span><span>dashed line = $0</span><span>now</span></div>`}
function ctlBtns(){const c=R.control||{};return `<div style="display:flex;gap:8px"><a class="rbig rb-stop" style="flex:1;margin-top:0" href="${CTL}" target="_blank" rel="noopener">STOP</a><a class="rbig ${c.pause||c.sell_all_and_stop?"rb-go":"rb-pause"}" style="flex:1;margin-top:0" href="${CTL}" target="_blank" rel="noopener">${c.pause||c.sell_all_and_stop?"Resume":"Pause"}</a></div><div class="rd" style="margin-top:6px">STOP sells everything and stops. Pause stops new buys but keeps managing open trades. Both open GitHub: tap <b>Run workflow</b>, pick <b>sell everything + stop</b>, <b>pause</b> or <b>resume</b>, then <b>Run workflow</b> again. The bot reads it within about 15 seconds. Now: <b class="${c.sell_all_and_stop?"r":c.pause?"y":"g"}">${c.sell_all_and_stop?"STOPPED":c.pause?"PAUSED":"On"}</b></div>`}
function stopKind(t){if(!t.stop||!t.entry)return"starting stop";const r=t.stop/t.entry;return r>1.005?"trailing, profit locked":r>0.985?"at breakeven":"starting stop"}
function amt(v){if(v==null)return"–";const a=Math.abs(v);return a===0?"0":a>=1000?v.toLocaleString("en-US",{maximumFractionDigits:2}):a>=1?v.toLocaleString("en-US",{maximumFractionDigits:5}):v.toPrecision(6).replace(/0+$/,"").replace(/\.$/,"")}
function cardBoard(){const C=((R.page||{}).main_wallets||{}).card;if(!C)return"";if(C.error)return`<div class="card"><h3>Wallet scorecard (main bot)</h3><div class="warn">${esc(C.error)}</div></div>`;
 const L={pnl:"7/30-day profit",winrate:"Win rate",quality:"Few max-loss coins",exits:"No instant dumps",consist:"Repeat winners",size:"Trade size",calm:"Calm pace"};
 const ST={pinned:'<span class="g">pinned</span>',keep:'<span class="g">kept</span>',new:'<span class="y">new, being scored</span>',bench:'<span class="m">benched</span>',removed:'<span class="r">removed</span>'};
 const v=x=>x==null?"–":x==1?"✓":x==0.5?"½":"✗";
 return `<div class="card"><h3>Wallet scorecard (main bot, ${C.length})</h3><div class="rd" style="margin-bottom:6px">The main bot's checklist, copied here every 5 minutes. Radium follows exactly the wallets the main bot follows. Your checklist, re-scored every 6 hours. Kept and pinned wallets are followed. Benched wallets aren't followed but stay here and come back when they score 4+ of 7. Removed wallets lost on the bot's copies again and again and are never followed.</div>
 ${C.map(c=>{const f=c.facts||{},s=c.score||{};return `<div class="row"><div class="rh"><span>${esc(c.name)} <span class="m s">${esc(c.addr)}</span></span><span class="s">${ST[c.status]||esc(c.status)} · ${c.total??"–"}/${c.items??"–"}</span></div><div class="rd">${Object.entries(L).map(([k,n])=>`${n} ${v(s[k])}`).join(" · ")}</div><div class="rd m">Win rate ${f.winrate==null?"–":f.winrate+"%"} · ${f.buys_per_day??"–"} buys/day · median buy ${f.buy_med_usd==null?"–":"$"+f.buy_med_usd} · bot copies ${f.copies||0} (${sgn(f.copy_net||0)})</div></div>`}).join("")}</div>`}
function walBoard(){const W=((R.page||{}).main_wallets||{}).board;if(!W)return"";
 if(W.error)return`<div class="card"><h3>How each copied wallet is doing (main bot)</h3><div class="warn">${esc(W.error)}</div></div>`;
 const list=W.real||[],fl=list.filter(r=>(r.flags||[]).length);
 return `<div class="card"><h3>How each copied wallet is doing (main bot, ${list.length})</h3><div class="rd" style="margin-bottom:6px">The main bot's results: every coin each wallet bought that passed the checks, copied at a flat $20, after all costs, since ${D(W.real_since)}. Best total first. A wallet needs ${W.min_trades}+ closed trades before it gets a verdict. Flags only: no wallet is removed unless you say so.</div>
 ${fl.length?`<div class="warn">Flagged: ${fl.map(r=>`<b>${esc(r.name)}</b> (${r.flags.join(", ")})`).join(", ")}</div>`:""}
 ${list.map(r=>walRow(r,W)).join("")||'<div class="empty">No copied trades yet.</div>'}</div>`}
function holdT(v){return v==null?"–":v<3600?Math.round(v/60)+" min":(v/3600).toFixed(1)+" h"}
function walRow(r,W){const mt=W.min_trades,F=r.flags||[],badge=r.verdict=="winning"?'<span class="g">winning</span>':r.verdict=="losing"?'<span class="r">losing</span>':`<span class="m">too early (${r.trades}/${mt} trades)</span>`;
 const fl=F.length?` <span class="tag t-killed">${F.map(esc).join(" · ")}</span>`:"";
 return `<div class="row"><div class="rh"><span>${esc(r.name)} <span class="m s">${esc(r.addr)}</span></span><span class="${cls(r.total)}">${sgn(r.total)}</span></div>
 <div class="rd">${badge}${fl}${r.following?"":' · <span class="m">no longer on the Kolscan list</span>'}</div>
 <div class="rd">${r.trades} closed${r.open?`, ${r.open} open`:""} · ${r.win_rate==null?"–":r.win_rate.toFixed(0)+"% won"} · avg ${sgn(r.avg)} a trade · avg hold ${holdT(r.avg_hold_s)}</div>
 <div class="rd">Dumped within ${W.quick_dump_min} min of buying: ${r.judged?`${r.quick} of ${r.judged} buys (${(r.quick_pct||0).toFixed(0)}%)`:"–"}${r.sold_before_copy?` · sold before the bot could copy ${r.sold_before_copy}×`:""}</div>
 ${r.best&&r.trades>1?`<div class="rd m">Best ${esc(r.best.coin)} ${sgn(r.best.pnl)} · worst ${esc(r.worst.coin)} ${sgn(r.worst.pnl)}</div>`:""}</div>`}
function usdx(v){if(v==null)return"–";const a=Math.abs(v);return a>=0.01||a===0?usd(v):(v<0?"-$":"$")+a.toPrecision(2)}
function balCurve(pts){if(!pts||pts.length<2)return'<div class="rd m" style="margin-top:8px">Balance chart: fills in as the wallet is checked, one point every 5 minutes.</div>';
 const W=600,H=170,P=6,xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),base=ys[0];let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys,base),y1=Math.max(...ys,base);const pad=(y1-y0)*0.08||Math.max(0.05,base*0.02);y0-=pad;y1+=pad;
 const X=x=>P+(x-x0)/(x1-x0||1)*(W-2*P),Y=y=>H-P-(y-y0)/(y1-y0)*(H-2*P);
 const d=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join("");const last=ys[ys.length-1],col=last>=base?"#22c55e":"#ef4444";
 return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:170px;width:100%;margin-top:8px"><line x1="0" x2="${W}" y1="${Y(base)}" y2="${Y(base)}" stroke="#3a4250" stroke-dasharray="4 4"/><path d="${d} L${X(x1)},${H} L${X(x0)},${H}Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" vector-effect="non-scaling-stroke"/></svg><div class="rd" style="display:flex;justify-content:space-between"><span>${T(x0)}</span><span>dashed line = ${usdx(base)} at the start</span><span>now</span></div>`}
function balFunded(pts){if(!pts)return pts;const i=pts.findIndex(p=>p[1]>=5);return i<0?pts:pts.slice(i)}
function balStats(pts){if(!pts||pts.length<2)return null;let pk=pts[0][1],mdd=0;for(const p of pts){pk=Math.max(pk,p[1]);if(pk>0)mdd=Math.max(mdd,(pk-p[1])/pk*100)}const a=pts[0][1],b=pts[pts.length-1][1];return{since:pts[0][0],chg:b-a,pct:a>0?(b-a)/a*100:null,mdd}}
function walletCard(M,L,o){const W=R.wallet,now=Date.now()/1000;
 const head=`<h3>Radium wallet${live()?" · real money":""}</h3>`;
 if(!W||(!W.ts&&!W.err))return `<div class="card">${head}<div class="big m">–</div><div class="rd">Reading the wallet… its exact balance shows here within a minute.</div></div>`;
 const age=W.ts?now-Math.min(W.ts,W.tokens_ts||W.ts):null,old=age==null||age>150;
 const toks=(W.tokens||[]).map(t=>`<div class="rh s" style="font-weight:400;padding:3px 0"><span>${esc(t.sym)}${t.bot?' <span class="m">· bot trade</span>':/(\.com|\.io|\.xyz|\.net|https?:|www\.|refund|claim|airdrop)/i.test((t.name||"")+" "+(t.sym||""))?' <span class="r">· looks like a spam airdrop, don\'t open its site</span>':' <span class="m">· not a bot trade, never touched</span>'}${t.frozen?' <span class="r">· frozen</span>':""}</span><span>${amt(t.amount)} · ${t.usd==null?'<span class="m">no price</span>':usdx(t.usd)}</span></div>`).join("");
 return `<div class="card">${head}<div class="big">${W.total_usd==null?"–":usdx(W.total_usd)}</div><div class="rd">Everything in the wallet, every coin, at today's prices${W.unpriced?` (${W.unpriced} coin${W.unpriced==1?"":"s"} with no price left out of the total)`:""}</div>${(()=>{const BA=balFunded((R.act48||{}).balance_all),st=balStats(BA);return (st?`<div class="${cls(st.chg)}" style="margin-top:4px">${sgn(st.chg)}${st.pct==null?"":` (${st.pct>=0?"+":""}${st.pct.toFixed(2)}%)`} since the wallet was funded ${D(st.since)} · <span class="m">deposits, withdrawals and the SOL price count here too</span></div>`:"")+balCurve(BA)})()}
 <div style="margin-top:8px"><div class="rh s" style="font-weight:400;padding:3px 0"><span>SOL</span><span>${amt(W.sol)} · ${usdx(W.sol_usd)}</span></div>${toks}</div>
 <div class="rd ${old?"y":"m"}" style="margin-top:6px">Balance checked ${age==null?"–":ago(age)}${W.sol_px?` · SOL ${usd(W.sol_px)}`:""}${W.err?` · last check failed: ${esc(W.err)}`:""}</div>
 ${W.rent_sol?`<div class="rd m">Plus ${amt(W.rent_sol)} SOL (${usdx(W.rent_usd)}) held as token-account deposits, not counted above.</div>`:""}
 <div class="grid" style="margin-top:10px"><div class="kv"><span>Usable for trades</span><b>${M.w==null?"–":usd(M.w)}</b><span>${M.w==null?"below 0.01 SOL, too little to trade":"fee reserve "+(L.reserve_sol??"–")+" SOL kept back"}</span></div><div class="kv"><span>In open trades${live()?"":" (dry run)"}</span><b>${o.length?usd(M.ov):"–"}</b></div><div class="kv"><span>Today (Lagos)${live()?"":" · dry run"}</span><b class="${cls(R.today)}">${sgn(R.today)}</b><span>new buys stop at -${usd(L.daily_loss,0)}</span></div><div class="kv"><span>Open trades</span><b>${o.length} of ${L.max_open??"–"}</b></div><div class="kv"><span>Max drawdown</span><b class="r">${(()=>{const st=balStats(balFunded((R.act48||{}).balance_all));return st?st.mdd.toFixed(1)+"%":"–"})()}</b><span>biggest fall from a high, on the chart</span></div></div></div>`}
const fs=v=>v==null?"–":v<1?Math.round(v*1000)+" ms":v<10?v.toFixed(1)+" s":Math.round(v)+" s";
function realCard(){const P=R.speed;if(!P)return"";const a=P.fill_total||{};
 const ln=(k,v)=>`<div class="rh s" style="font-weight:400;padding:3px 0"><span>${k}</span><span>${usd(v)}</span></div>`;

  h+=`<div class="card"><h3>Limits</h3><div class="grid"><div class="kv"><span>Max loss per trade</span><b>${usd(L.max_loss)}</b></div><div class="kv"><span>Buy size</span><b>${usd(L.max_stake)}</b></div><div class="kv"><span>Open at once</span><b>${L.max_open}</b></div><div class="kv"><span>Daily / total loss cap</span><b>${usd(L.daily_loss,0)} / ${usd(L.total_loss,0)}</b></div></div><div class="s" style="margin-top:6px"><a style="color:var(--b)" href="javascript:void 0" onclick="go('ctl');return false">All limits and controls →</a></div></div>`;
 }
 if(tab=="pos")h+=`<div class="card"><h3>Open positions (${o.length} of ${L.max_open??"–"})</h3>${o.length?o.map(posCard).join(""):'<div class="empty">No open trades right now.</div>'}</div><div class="card"><h3>Rules it follows</h3>${RULES_().map(r=>`<div class="rd">• ${esc(r)}</div>`).join("")}</div>`;
 if(tab=="hist"){h+=`<div class="card"><h3>Closed trades (${x.closed||0}) · total ${sgn(x.pnl||0)}</h3>${cl.length?cl.map(histCard).join(""):'<div class="empty">No closed trades yet.</div>'}</div>`;if((R.skipped||[]).length)h+=`<div class="card"><h3>Signals Radium skipped (${R.skipped.length})</h3>${R.skipped.map(skipCard).join("")}</div>`}
 if(tab=="sig"){const F=[["all","All real buys"],["copied",would("Bought","Would buy")],["killed","Blocked"],["passed","Passed, not copied"],["skip","Skipped"],["ignored","Not real buys"]];
  const list=(pg.signals||[]).filter(z=>sigF=="all"?z.verdict!="ignored":z.verdict==sigF);
  h+=`<div class="filt">${F.map(([k,n])=>`<button class="${k==sigF?"act":""}" onclick="sigF='${k}';render()">${n}</button>`).join("")}</div><div class="card"><h3>${list.length} shown, newest first</h3>${list.slice(0,150).map(sigCard).join("")||'<div class="empty">Nothing here yet.</div>'}</div>`}
 if(tab=="stats"){const co=pg.costs||{},sc=pg.sig_counts||{};
  h+=`<div class="card"><h3>Results${live()?"":" · dry run"}</h3><div class="grid"><div class="kv"><span>Closed trades</span><b>${x.closed||0}</b></div><div class="kv"><span>Win rate</span><b>${wr==null?"–":wr+"%"}</b><span>${x.wins||0} won</span></div><div class="kv"><span>Total P&amp;L</span><b class="${cls(x.pnl)}">${sgn(x.pnl||0)}</b><span>closed trades</span></div><div class="kv"><span>Today (Lagos)</span><b class="${cls(R.today)}">${sgn(R.today)}</b></div><div class="kv"><span>Best</span><b class="g">${pg.best?pct(pg.best[0],0):"–"}</b><span>${pg.best?esc(pg.best[2])+" "+sgn(pg.best[1]):""}</span></div><div class="kv"><span>Worst</span><b class="r">${pg.worst?pct(pg.worst[0],0):"–"}</b><span>${pg.worst?esc(pg.worst[2])+" "+sgn(pg.worst[1]):""}</span></div></div></div>`;
  h+=`<div class="card"><h3>Costs and speed</h3><div class="grid"><div class="kv"><span>Fees paid</span><b>${usd(co.fees||0)}</b><span>network + priority</span></div><div class="kv"><span>Average price impact</span><b>${co.impact!=null?co.impact.toFixed(1)+"%":"–"}</b></div><div class="kv"><span>Average entry vs paper bot</span><b>${co.slip!=null?pct(co.slip,1):"–"}</b><span>above = paid more</span></div><div class="kv"><span>Average delay after the signal</span><b>${secs(co.lag)}</b></div></div></div>`;
  h+=`<div class="card"><h3>What blocked coins</h3>${(pg.filters||[]).length?pg.filters.map(([k,n])=>`<div class="rh s" style="font-weight:400;padding:4px 0"><span>${esc(k)}</span><span>${n}</span></div>`).join(""):'<div class="empty">Nothing blocked yet.</div>'}<div class="rd" style="margin-top:6px">Since ${R.since?D(R.since):"start"}: ${sc.survivor||0} passed, ${sc.killed||0} blocked, ${sc.repeat||0} repeats, ${sc.ignored||0} not real buys.</div></div>`}
 if(tab=="log")h+=`<div class="card"><h3>What the bot did, newest first</h3>${(R.events||[]).length?R.events.map(e=>`<div class="row"><div class="rh" style="font-weight:400"><span class="${e.kind=="bad"?"r":e.kind=="buy"?"g":e.kind=="sell"?"y":""}">${esc(e.msg)}</span><span class="m s" style="white-space:nowrap">${T(e.ts)}</span></div></div>`).join(""):'<div class="empty">Nothing logged yet.</div>'}</div>`;
 if(tab=="wal"){const W=pg.wallets||[];h+=`<div class="card"><h3>Smart wallets followed (${W.length})</h3><div class="rd" style="margin-bottom:6px">The same list as the paper main account, picked up within about 5 minutes of a change. Ranked by Kolscan rank; the Kolscan rank and record come from the main bot.</div>${W.map(w=>`<div class="row"><div class="rh"><span>#${w.rank??"–"} ${esc(w.name)} <span class="m s">${esc(w.addr)}</span></span><span class="${cls(w.closed?w.pnl:null)} s">${w.closed?sgn(w.pnl):""}</span></div><div class="rd">Radium: ${w.closed||0} closed, ${w.wins||0} won${w.open?`, ${w.open} open`:""}${w.skipped?`, ${w.skipped} skipped`:""} · last 7 days: ${w.sig_7d||0} buys seen, ${w.pass_7d||0} passed, ${w.kill_7d||0} blocked</div><div class="rd m">${w.k_wins??0} wins / ${w.k_losses??0} losses on Kolscan${w.k_pnl!=null?" ("+sgn(w.k_pnl,0)+")":""}${w.every_s?" · checked every "+w.every_s+"s":""}${w.last_check?" · last "+ago(s.now-w.last_check):""}</div></div>`).join("")||'<div class="empty">No wallet list yet.</div>'}</div>`;h+=walBoard()+cardBoard()}
 if(tab=="ctl"){h+=`<div class="card"><h3>Controls</h3>${ctlBtns()}</div>`;
  h+=`<div class="card"><h3>Wallet and key</h3><div class="grid"><div class="kv"><span>Wallet</span><b>${funded()?R.balance_sol.toFixed(4)+" SOL":"–"}</b><span>${funded()?"about "+usd(R.balance_usd):(R.wallet_set?"not funded yet":"not set")}</span></div><div class="kv"><span>Key secret</span><b>${R.key_set?(R.key_matches?"Matches":'<span class="r">Wrong key</span>'):"Not added"}</b><span>${R.key_set?(R.key_matches?"live allowed after your go":"live is refused"):"fine for the dry run"}</span></div></div><div class="rd" style="margin-top:8px">The wallet address and key are never shown on this page.</div></div>`;
  h+=limitsCard()+engCard()}
 $("#main").innerHTML=h;$("#foot").innerHTML=`Data from ${TT(R.ts)} Lagos time (${ago(s.age)}) · the bot sends new data about every minute, and this page checks every minute. While this page is open, open-trade prices refresh about every 10 seconds straight from Jupiter<br><a style="color:var(--mut)" href="${WF}" target="_blank" rel="noopener">The bot runs on GitHub Actions</a><br>${live()?"LIVE: real money in the Radium wallet.":"Dry run: nothing is signed or sent, no money moves."} Your wallet address is never shown on this page.`}
function b64(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function fetchBlob(){
 try{const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/radium.enc?ref=radium-data&t=${Date.now()}`,{cache:"no-store",headers:{Accept:"application/vnd.github.raw"}});if(r.ok)return(await r.text()).trim()}catch(e){}
 const r=await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/radium-data/radium.enc?t=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw new Error("fetch "+r.status);return(await r.text()).trim()}
async function load(){if(!K){errMsg="This link is missing its key. Open the full link you were sent.";render();return}
 try{const raw=b64((window.__RAD_BLOB||await fetchBlob()).replace(/\s/g,""));const key=await crypto.subtle.importKey("raw",b64(K),"AES-GCM",false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(0,12)},key,raw.slice(12));
  const txt=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  R=JSON.parse(txt);errMsg=""}catch(e){if(!R)errMsg=String(e.message).includes("404")?"No data yet. The bot's first report arrives a minute or two after its first run starts.":String(e.name)=="OperationError"?"The key in this link doesn't match. Open the full link you were sent.":"Couldn't load the bot's data yet. It will retry by itself."}
 render();lq()}
// ---- live market prices for open trades (display only: the bot, its stops and its books are not touched)
const LQ={};let lqBusy=false;
async function lq(){if(lqBusy||!R||document.hidden)return;const ms=[...new Set((R.open||[]).map(t=>t.mint).filter(Boolean))];if(!ms.length)return;lqBusy=true;
 try{const r=await fetch("https://lite-api.jup.ag/price/v3?ids="+ms.join(","),{cache:"no-store"});if(r.ok){const d=await r.json(),t=Date.now()/1000;for(const m of ms){const q=d&&d[m];if(q&&+q.usdPrice>0)LQ[m]={p:+q.usdPrice,t}}if(tab=="ov"||tab=="pos")render()}}catch(e){}lqBusy=false}
load();setInterval(load,60000);setInterval(lq,10000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
